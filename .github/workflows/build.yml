# build.yml — GitHub Actions: 在 macOS runner 上自动构建 AstraNotes.app
#
# 触发方式:
#   - push 到 master
#   - 手动触发 (Actions 页面 → Run workflow)
#
# 产出: 构建完成的 AstraNotes.app 压缩包 (AstraNotes-macOS-arm64.zip)
# 文档: BUILD.md

name: Build macOS App

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-14 = Apple Silicon (arm64) 公共 runner，与 M4 架构一致
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify icons are in sync
        run: |
          node scripts/generate_icons.js
          git diff --exit-code AstraNotes/DesignSystem/Icons/AstraIcon.swift || {
            echo "::error::AstraIcon.swift 与 scripts/generate_icons.js 不同步。请本地运行: node scripts/generate_icons.js 后提交。"
            exit 1
          }

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release)
        run: |
          xcodebuild \
            -project AstraNotes.xcodeproj \
            -scheme AstraNotes \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package .app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release/AstraNotes.app \
            AstraNotes-macOS-arm64.zip
          ls -lh AstraNotes-macOS-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstraNotes-macOS-arm64
          path: AstraNotes-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 30
