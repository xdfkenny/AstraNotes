# build.yml — GitHub Actions: 在 macOS runner 上自动构建 AstraNotes.app
#
# 触发方式:
#   - push 到 master
#   - 手动触发 (Actions 页面 → Run workflow)
#
# 产出: AstraNotes.dmg (含 ad-hoc 签名的 .app，可直接在 M1-M4 Mac 上运行)
# 文档: BUILD.md

name: Build macOS App

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-15 = Apple Silicon (arm64) 公共 runner，与 M4 架构一致
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify icons are in sync
        run: |
          node scripts/generate_icons.js
          git diff --exit-code AstraNotes/DesignSystem/Icons/AstraIcon.swift || {
            echo "::error::AstraIcon.swift 与 scripts/generate_icons.js 不同步。请本地运行: node scripts/generate_icons.js 后提交。"
            exit 1
          }

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release)
        run: |
          set -o pipefail
          xcodebuild \
            -project AstraNotes.xcodeproj \
            -scheme AstraNotes \
            -destination 'generic/platform=macOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log

      - name: Package DMG
        run: |
          APP=$(find build/Build/Products -name "AstraNotes.app" -type d | head -1)
          echo "Found app at: $APP"
          # Ad-hoc sign so the app can launch on Apple Silicon
          codesign --force --deep --sign - "$APP" || true
          hdiutil create -volname "AstraNotes" -srcfolder "$APP" -ov -format UDZO AstraNotes.dmg
          ls -lh AstraNotes.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstraNotes-macOS-dmg
          path: AstraNotes.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
